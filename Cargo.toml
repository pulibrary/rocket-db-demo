[package]
name = "rocket-db-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5.2", features = ["json"] }

[dependencies.rocket_db_pools]
version = "0.2.0"
features = ["sqlx_postgres"]

[dependencies.sqlx]
version = "0.7.0"
default-features = false
features = ["macros", "migrate"]

